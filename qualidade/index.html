<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Qualidade 10S · Demo</title>
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-mark"><img src="assets/images/logo-exemplo-mark.png" alt="Distribuidora Exemplo"></div>
      <div>
        <strong>DISTRIBUIDORA EXEMPLO</strong>
        <span>QUALIDADE · 10S</span>
      </div>
    </div>
    <h1>Entrar</h1>
    <p class="login-sub">Use o e-mail e a senha cadastrados pelo administrador.<br><small>Demonstração: qualquer e-mail e senha funcionam.</small></p>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" autocomplete="current-password" required>
      </div>
      <label class="login-lembrar" for="login-lembrar">
        <input type="checkbox" id="login-lembrar">
        <span>Manter-me conectado</span>
      </label>
      <div class="login-erro hidden" id="login-erro" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<div id="app-shell" class="hidden">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-mark"><img src="assets/images/logo-exemplo-mark.png" alt="Distribuidora Exemplo"></div>
      <div class="brand-text">
        <strong>DISTRIBUIDORA EXEMPLO</strong>
        <span>QUALIDADE · 10S</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- injetado por app.js -->
    </nav>
    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-nome" id="user-nome">—</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="btn-sair" id="btn-sair" title="Sair do sistema">Sair</button>
    </div>
    <div class="sidebar-footer">Qualidade 10S · Demo<br>Relatórios oficiais A4</div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="main-area">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">Visão geral das vistorias</div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Mudar para o tema escuro" title="Mudar para o tema escuro">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="badge-leitura hidden" id="topbar-perfil"></span>
    </header>

    <main class="content" id="view-root">
      <!-- conteúdo de cada módulo é renderizado aqui -->
    </main>
  </div>
</div>

<!-- ===================== MODAL GENÉRICO ===================== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Título</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ===================== LIGHTBOX DE FOTOS ===================== -->
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
  <img id="lightbox-img" src="" alt="Evidência fotográfica ampliada">
  <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
  <div class="lightbox-counter" id="lightbox-counter">Foto 1 de 1</div>
</div>

<div id="toast-container"></div>

<!-- ===================== SCRIPTS ===================== -->
<!-- Núcleo -->
<script src="demo/demo-data.js"></script>
<script src="demo/seed.js"></script>
<script src="demo/supabase-mock.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/store.js"></script>
<script src="database/supabase.js"></script>
<script src="assets/js/auth.js"></script>

<!-- Camada de dados -->
<script src="database/queries/sensos.js"></script>
<script src="database/queries/vistorias.js"></script>
<script src="database/queries/naoConformidades.js"></script>
<script src="database/queries/evidencias.js"></script>
<script src="database/queries/acompanhamentos.js"></script>
<script src="database/queries/retornos.js"></script>
<script src="database/queries/auditorias10s.js"></script>

<!-- Utilitários de negócio -->
<script src="utils/alerts.js"></script>
<script src="utils/checklist10s.js"></script>
<script src="utils/nota10s.js"></script>

<!-- Componentes de UI compartilhados -->
<script src="assets/js/components.js"></script>

<!-- Módulos -->
<script src="modules/dashboard/dashboard.js"></script>
<script src="modules/vistorias/vistorias.js"></script>
<script src="modules/nao-conformidades/nao-conformidades.js"></script>
<script src="modules/acompanhamento/acompanhamento.js"></script>
<script src="modules/evidencias/evidencias.js"></script>
<script src="modules/retornos/retornos.js"></script>
<script src="modules/relatorios/relatorios.js"></script>
<script src="modules/relatorios/relatorio-export.js"></script>
<script src="modules/auditorias/auditorias.js"></script>
<script src="modules/usuarios/usuarios.js"></script>
<script src="modules/auditoria/auditoria.js"></script>

<!-- App / roteador (por último) -->
<script src="assets/js/app.js"></script>
</body>
</html>
